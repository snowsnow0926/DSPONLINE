name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        default: stable
        type: choice
        options: [stable, beta, nightly]
  push:
    tags: ["desktop-v*"]

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    env:
      DSP_RELEASE_CHANNEL: ${{ inputs.channel || 'stable' }}
      DSP_DESKTOP_API_BASE_URL: https://dsponline.cn/api
      DSP_UPDATE_BASE_URL: https://dsponline.cn/downloads/desktop
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run licenses:check
      - run: npm run typecheck
      - run: npm run test:native
      - run: npm run desktop:release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dsp-idle-${{ env.DSP_RELEASE_CHANNEL }}
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/update-feed/**
