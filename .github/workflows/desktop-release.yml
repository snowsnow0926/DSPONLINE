name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        default: stable
        type: choice
        options: [stable, beta, nightly]
  push:
    tags: ["desktop-v*"]

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    env:
      DSP_RELEASE_CHANNEL: ${{ inputs.channel || 'stable' }}
      DSP_DESKTOP_API_BASE_URL: https://dsponline.cn/api
      DSP_UPDATE_BASE_URL: https://dsponline.cn/downloads/desktop
      CARGO_BUILD_JOBS: "1"
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run licenses:check
      - run: npm run typecheck
      - run: npm run test:native-core:serial
      - run: npm run native:build-host
      - run: npm run test:native
      - run: npm run desktop:release
      - name: Resolve the complete desktop release output
        shell: pwsh
        run: |
          $relative = node desktop/select-desktop-release-output.cjs
          if ($LASTEXITCODE -ne 0) { throw "Expected exactly one complete desktop release output" }
          "DSP_DESKTOP_RELEASE_OUTPUT=$relative" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dsp-idle-${{ env.DSP_RELEASE_CHANNEL }}
          if-no-files-found: error
          path: |
            ${{ env.DSP_DESKTOP_RELEASE_OUTPUT }}/*.exe
            ${{ env.DSP_DESKTOP_RELEASE_OUTPUT }}/*.blockmap
            ${{ env.DSP_DESKTOP_RELEASE_OUTPUT }}/latest.yml
            ${{ env.DSP_DESKTOP_RELEASE_OUTPUT }}/update-feed/**
