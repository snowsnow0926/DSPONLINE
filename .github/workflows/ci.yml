name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit (typecheck + licenses + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm --prefix server ci
      - run: npm run licenses:check
      - run: npm run typecheck
      - run: npm run native:build-host
      # Full simulation fixtures share a constrained runner; preserve their
      # original timing thresholds and serialize file workers.
      - run: npm test -- --maxWorkers=1

  server-ops-native:
    name: Server + Ops + Native
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm --prefix server ci
      - run: npm run test:server
      - name: Provide the production Node entry point for Linux service tests
        run: |
          if [ ! -e /usr/bin/node ]; then
            sudo ln -s "$(command -v node)" /usr/bin/node
          fi
          /usr/bin/node --version
      - run: npm run test:ops
      - run: npm run test:native-core:serial
      - run: npm run native:build-host
      - run: npm run test:native

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm --prefix server ci
      - run: npm run build

  e2e-shard-1:
    name: E2E shard 1/2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm --prefix server ci
      - name: Cache Playwright browsers
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Verify existing Chrome or install the same stable channel
        shell: bash
        run: |
          if ! node scripts/verify-ci-chrome.mjs; then
            npx playwright install --with-deps chrome
            node scripts/verify-ci-chrome.mjs
          fi
      - run: npm run test:e2e -- --shard=1/2 --workers=1
      - name: Report slowest tests in this shard
        if: always()
        run: npm run test:report:slowest -- --limit 10
      - name: Upload shard timing JSON
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-json-shard-1
          path: test-results/playwright-report.json
          if-no-files-found: ignore

  e2e-shard-2:
    name: E2E shard 2/2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm --prefix server ci
      - name: Cache Playwright browsers
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Verify existing Chrome or install the same stable channel
        shell: bash
        run: |
          if ! node scripts/verify-ci-chrome.mjs; then
            npx playwright install --with-deps chrome
            node scripts/verify-ci-chrome.mjs
          fi
      - run: npm run test:e2e -- --shard=2/2 --workers=1
      - name: Report slowest tests in this shard
        if: always()
        run: npm run test:report:slowest -- --limit 10
      - name: Upload shard timing JSON
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-json-shard-2
          path: test-results/playwright-report.json
          if-no-files-found: ignore

  e2e-report:
    name: E2E slowest-tests summary
    needs: [e2e-shard-1, e2e-shard-2]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: shard-reports
      - name: Merge shard timing JSON and print top 20
        run: node scripts/report-slowest-tests.mjs shard-reports/playwright-json-shard-1/playwright-report.json shard-reports/playwright-json-shard-2/playwright-report.json --limit 20
