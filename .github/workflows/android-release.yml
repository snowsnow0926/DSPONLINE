name: Android Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        default: stable
        type: choice
        options: [stable, beta, nightly]
      version_code:
        description: Required for beta/nightly; optional for stable SemVer builds
        required: false
        type: string
  push:
    tags: ["android-v*"]

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    env:
      DSP_RELEASE_CHANNEL: ${{ inputs.channel || 'stable' }}
      DSP_ANDROID_API_BASE_URL: https://dsponline.cn/api
      DSP_ANDROID_UPDATE_BASE_URL: https://dsponline.cn/downloads/android
      DSP_ANDROID_PUBLIC_ORIGIN: https://dsponline.cn
      DSP_NATIVE_UPDATE_BASE_URL: https://dsponline.cn/downloads/
      DSP_ANDROID_VERSION_CODE: ${{ inputs.version_code }}
      DSP_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      DSP_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      DSP_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_CERTIFICATE_SHA256: ${{ secrets.ANDROID_CERTIFICATE_SHA256 }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 21
      - name: Restore Android signing key
        shell: pwsh
        run: |
          if (-not $env:ANDROID_KEYSTORE_BASE64) { throw "ANDROID_KEYSTORE_BASE64 is not configured" }
          $path = Join-Path $env:RUNNER_TEMP "dsp-idle-release.p12"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))
          "DSP_ANDROID_KEYSTORE=$path" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - run: npm ci
      - run: npm run licenses:check
      - run: npm run typecheck
      - run: npm run test:native
      - run: npm run android:release
      - name: Create Android update manifest
        shell: pwsh
        run: node scripts/create-native-update-manifests.mjs --channel $env:DSP_RELEASE_CHANNEL --android-apk android/app/build/outputs/apk/release/app-release.apk --android-certificate-sha256 $env:ANDROID_CERTIFICATE_SHA256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dsp-idle-android-${{ env.DSP_RELEASE_CHANNEL }}
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            release/update-feed/android/**
