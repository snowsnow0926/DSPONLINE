[workspace]
members = ["dsp-native-core", "dsp-native-host"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
rust-version = "1.96"

[workspace.dependencies]
anyhow = "1.0.99"
crc32fast = "1.5.0"
hex = "0.4.3"
num-bigint = "0.4.6"
num-traits = "0.2.19"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["float_roundtrip", "raw_value"] }
ryu-js = "1.0.3"
sha2 = "0.10.9"
thiserror = "2.0.17"
zstd = "0.13.3"
