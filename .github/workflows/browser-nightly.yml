name: Nightly Browser Compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: "23 18 * * *"

permissions:
  contents: read

concurrency:
  group: browser-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firefox-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps firefox webkit
      - run: npm run test:e2e:nightly
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: browser-nightly-failure-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            playwright-report/**
            test-results/**
